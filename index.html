function getCustomData() {
    try {
        const d = localStorage.getItem('nav_custom_data');
        return d ? JSON.parse(d) : null;
    } catch(e) { return null; }
}

function saveCustomData(data) {
    localStorage.setItem('nav_custom_data', JSON.stringify(data));
}

function getData() {
    return getCustomData() || JSON.parse(JSON.stringify(defaultCategories));
}

let currentData = getData();

// ===== Icon Fallback Colors =====
const fallbackColors = [
    'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
    'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
    'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',

    'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',

    'linear-gradient(135deg, #fccb90 0%, #d57eeb 100%)',
    'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)',
    'linear-gradient(135deg, #f5576c 0%, #ff6a00 100%)',
    'linear-gradient(135deg, #13547a 0%, #80d0c7 100%)',
    'linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%)',
    'linear-gradient(135deg, #ec4899 0%, #f97316 100%)',
];

function createIconFallback(img) {
    const info = img.closest('.site-def-url-body')?.querySelector('.site-def-url-info');
    const title = info?.querySelector('.site-def-url-title')?.textContent || '?';
    const firstChar = title.charAt(0).toUpperCase();
    const hash = title.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
    const color = fallbackColors[hash % fallbackColors.length];
    
    const fallback = document.createElement('div');
    fallback.className = 'icon-fallback';
    fallback.textContent = firstChar;
    fallback.style.background = color;
    img.parentNode.replaceChild(fallback, img);
}

// ===== Render =====
function render() {
    const container = document.getElementById('mainContent');
    container.innerHTML = '';
    currentData.forEach((cat, catIdx) => {
        const card = document.createElement('div');
        card.className = 'collect-card';
        
        let tabsHtml = '';
        if (cat.tabs && cat.tabs.length > 1) {
            tabsHtml = '<div class="term-tab">' + cat.tabs.map((tab, i) => 
                `<a href="javascript:" class="term-tab-switch ${i === 0 ? 'term-active' : ''}" data-cat="${catIdx}" data-tab="${tab.id}" onclick="switchTab(this)">${tab.name}</a>`
            ).join('') + '</div>';
        }
        
        let sitesHtml = '';
        if (cat.tabs && cat.tabs.length > 0) {
            cat.tabs.forEach((tab, i) => {
                const sites = (cat.sites && cat.sites[tab.id]) || [];
                sitesHtml += `<div class="collect-card-tab ${i === 0 ? 'tab-active' : ''}" data-tabid="${tab.id}">`;
                sites.forEach(site => {
                    const iconHtml = site.icon 
                        ? `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" data-lazy="${site.icon}" alt="">`
                        : `<i class="fas fa-globe" style="color:#6366f1;font-size:1.2rem;"></i>`;
                    sitesHtml += `
                        <div class="site-def-card-item">
                            <a href="${site.url}" target="_blank" class="site-def-url-card">
                                <div class="site-def-url-body">
                                    <div class="site-def-url-img">${iconHtml}</div>
                                    <div class="site-def-url-info">
                                        <div class="site-def-url-title">${site.title}</div>
                                        <div class="site-def-url-desc">${site.desc || ''}</div>
                                    </div>
                                </div>
                            </a>
                        </div>`;
                });
                sitesHtml += '</div>';
            });
        }

        card.innerHTML = `
            <div class="collect-card-header">
                <h3 class="term-title"><i class="${cat.icon || 'fas fa-folder'}"></i> ${cat.title}</h3>
                ${tabsHtml}
                <div class="term-desc">${cat.desc || ''}</div>
            </div>
            <div class="collect-card-content">${sitesHtml}</div>
        `;
        container.appendChild(card);
    });
    
    // Lazy load images
    lazyLoadImages();
}

// ===== Tab Switch =====
function switchTab(el) {
    const catIdx = el.dataset.cat;
    const tabId = el.dataset.tab;
    const card = el.closest('.collect-card');
    
    card.querySelectorAll('.term-tab-switch').forEach(t => t.classList.remove('term-active'));
    el.classList.add('term-active');
    
    card.querySelectorAll('.collect-card-tab').forEach(t => t.classList.remove('tab-active'));
    card.querySelector(`[data-tabid="${tabId}"]`).classList.add('tab-active');
    
    lazyLoadImages();
}

// ===== Search =====
let currentSearchUrl = 'https://cn.bing.com/search?q=%s%';

function doSearch(e) {
    e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    const url = currentSearchUrl.replace('%s%', encodeURIComponent(q));
    window.open(url, '_blank');
}

// Search menu toggle
document.getElementById('searchMenu').addEventListener('click', function(e) {
    const li = e.target.closest('li');
    if (!li) return;
    this.querySelectorAll('li').forEach(l => l.classList.remove('active'));
    li.classList.add('active');
    const group = li.dataset.group;
    document.querySelectorAll('.search-group').forEach(g => g.classList.remove('active'));
    document.getElementById('group-' + group).classList.add('active');
});

// Search engine switch
document.getElementById('searchEngines').addEventListener('click', function(e) {
    const li = e.target.closest('li[data-search]');
    if (!li) return;
    const group = li.closest('.search-group');
    group.querySelectorAll('li').forEach(l => l.classList.remove('active'));
    li.classList.add('active');
    currentSearchUrl = li.dataset.search;
    document.getElementById('searchInput').placeholder = li.dataset.placeholder;
});

// ===== Lazy Load with Icon Fallback =====
function lazyLoadImages() {
    const images = document.querySelectorAll('img[data-lazy]');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                const lazySrc = img.dataset.lazy;
                delete img.dataset.lazy;
                observer.unobserve(img);
                
                // Set up error handler BEFORE setting src
                img.onerror = function() {
                    createIconFallback(this);
                };
                img.onload = function() {
                    // Successfully loaded
                    this.style.opacity = '1';
                };
                img.style.opacity = '0';
                img.style.transition = 'opacity 0.3s';
                img.src = lazySrc;
            }
        });
    }, { rootMargin: '100px' });
    images.forEach(img => observer.observe(img));
}

}

function closeAdmin() {

function renderAdminCategories() {
    const list = document.getElementById('adminCategoryList');
    list.innerHTML = '';
    currentData.forEach((cat, idx) => {
        const item = document.createElement('div');
        item.className = 'admin-category-item';
        const siteCount = Object.values(cat.sites || {}).reduce((sum, arr) => sum + arr.length, 0);
        item.innerHTML = `
            <span class="cat-name"><i class="${cat.icon || 'fas fa-folder'}" style="margin-right:6px;color:#6366f1;"></i>${cat.title} <small style="color:#556677;">(${siteCount})</small></span>
            <div class="cat-actions">
                <button title="上移" onclick="moveCat(${idx},-1)">↑</button>
                <button title="下移" onclick="moveCat(${idx},1)">↓</button>
                <button title="编辑" onclick="editCat(${idx})">✎</button>
                <button title="删除" onclick="deleteCat(${idx})">✕</button>
            </div>
        `;
        list.appendChild(item);
    });
}

function updateCatSelect() {
    const sel = document.getElementById('addSiteCat');
    sel.innerHTML = currentData.map((cat, i) => `<option value="${i}">${cat.title}</option>`).join('');
    updateTabSelect();
}

function updateTabSelect() {
    const catIdx = document.getElementById('addSiteCat').value;
    const cat = currentData[catIdx];
    const sel = document.getElementById('addSiteTab');
    if (cat && cat.tabs) {
        sel.innerHTML = cat.tabs.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    } else {
        sel.innerHTML = '<option value="default">默认</option>';
    }
}

function addCategory() {
    const title = document.getElementById('newCatTitle').value.trim();
    if (!title) return alert('请输入分类名称');
    const icon = document.getElementById('newCatIcon').value.trim() || 'fas fa-folder';
    const desc = document.getElementById('newCatDesc').value.trim();
    const id = 'term-custom-' + Date.now();
    const tabId = 'tab-custom-' + Date.now();
    currentData.push({
        id, icon, title, desc,
        tabs: [{ id: tabId, name: '全部' }],
        sites: { [tabId]: [] }
    });
    saveCustomData(currentData);
    render();
    renderAdminCategories();
    updateCatSelect();
    document.getElementById('newCatTitle').value = '';
    document.getElementById('newCatIcon').value = '';
    document.getElementById('newCatDesc').value = '';
}

function addSite() {
    const catIdx = parseInt(document.getElementById('addSiteCat').value);
    const tabId = document.getElementById('addSiteTab').value;
    const title = document.getElementById('addSiteTitle').value.trim();
    const url = document.getElementById('addSiteUrl').value.trim();
    const desc = document.getElementById('addSiteDesc').value.trim();
    const icon = document.getElementById('addSiteIcon').value.trim();
    if (!title || !url) return alert('请填写标题和URL');
    
    if (!currentData[catIdx].sites) currentData[catIdx].sites = {};
    if (!currentData[catIdx].sites[tabId]) currentData[catIdx].sites[tabId] = [];
    currentData[catIdx].sites[tabId].push({ url, icon, title, desc });
    saveCustomData(currentData);
    render();
    renderAdminCategories();
    document.getElementById('addSiteTitle').value = '';
    document.getElementById('addSiteUrl').value = '';
    document.getElementById('addSiteDesc').value = '';
    document.getElementById('addSiteIcon').value = '';
}

function moveCat(idx, dir) {
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= currentData.length) return;
    [currentData[idx], currentData[newIdx]] = [currentData[newIdx], currentData[idx]];
    saveCustomData(currentData);
    render();
    renderAdminCategories();
}

function deleteCat(idx) {
    if (!confirm(`确定删除分类「${currentData[idx].title}」？`)) return;
    currentData.splice(idx, 1);
    saveCustomData(currentData);
    render();
    renderAdminCategories();
    updateCatSelect();
}

function editCat(idx) {
    const cat = currentData[idx];
    const newTitle = prompt('分类标题:', cat.title);
    if (newTitle === null) return;
    const newDesc = prompt('分类描述:', cat.desc || '');
    cat.title = newTitle || cat.title;
    cat.desc = newDesc !== null ? newDesc : cat.desc;
    saveCustomData(currentData);
    render();
    renderAdminCategories();
}

function exportData() {
    const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nav-data-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
}

function importData() {
    document.getElementById('importFileInput').click();
}

function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            const imported = JSON.parse(ev.target.result);
            if (!Array.isArray(imported)) throw new Error('Invalid format');
            currentData = imported;
            saveCustomData(currentData);
            render();
            renderAdminCategories();
            updateCatSelect();
            alert('导入成功！');
        } catch(err) {
            alert('导入失败: ' + err.message);
        }
    };
    reader.readAsText(file);
    e.target.value = '';
}

function resetData() {
    if (!confirm('确定重置为默认数据？自定义修改将丢失。')) return;
    localStorage.removeItem('nav_custom_data');
    currentData = JSON.parse(JSON.stringify(defaultCategories));
    render();
    renderAdminCategories();
    updateCatSelect();
    alert('已重置为默认数据');
}

function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== Init =====
document.addEventListener('DOMContentLoaded', function() {
    render();
});

    </script>
